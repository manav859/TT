<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tusk Tales</title>
    <meta name="description" content="Tusk Tales — Purpose in every frame. A creative studio for brands that deserve to be felt." />

    <!-- Above-the-fold hero asset preload (loads in parallel with the main bundle).
         Must match HERO_IMAGE in HeroSection.tsx — otherwise we pay to fetch an
         image that is never shown and the real hero still loads late. -->
    <link rel="preload" as="image" href="/images/Tusk%20tales%20(79).jpg.jpeg" fetchpriority="high" />

    <!-- Favicon — theme-aware: black mark on light theme, white mark on dark theme -->
    <link rel="icon" type="image/png" href="/favicon.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-white.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
